name: flutter_frontend
description: "A simple expense tracker with local SQLite, dashboards, transactions by month, and budgets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.4
  provider: ^6.1.5+1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
